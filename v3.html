<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="日本で飼育されているコアラの非公式家系図">
  <title>日本のコアラ家系図</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.css">
  <link rel="stylesheet" href="./assets/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="./data.js"></script>
  <script src="./assets/app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <h1>日本のコアラ家系図</h1>
        <p>個体・親子関係と、見やすさのための表示レイアウトを分けて管理しています。</p>
      </div>
      <div class="hero-badge">非公式データベース</div>
    </header>

    <section class="panel control-panel" aria-label="家系図の操作">
      <div class="field">
        <label for="view-select">表示する範囲</label>
        <select id="view-select"></select>
      </div>
      <div class="actions">
        <button id="render-view" class="primary" type="button">家系図を表示</button>
        <label class="toggle"><input id="edit-layout" type="checkbox"> レイアウト編集</label>
        <button id="export-layout" class="secondary" type="button">レイアウトを書き出す</button>
        <a id="download-csv" class="download-link" href="#" download>CSVを開く</a>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div class="legend" aria-label="凡例">
        <span class="male">オス</span>
        <span class="female">メス</span>
        <span class="junction">親ペアの接点</span>
        <span class="route">編集時の中継点</span>
      </div>
    </section>

    <section class="panel network-panel">
      <div id="network-container" aria-label="コアラの家系図"></div>
    </section>

    <details class="panel advanced">
      <summary>CSV・JSONを直接貼り付けて確認する</summary>
      <div class="advanced-grid">
        <div class="source-toggle">
          <label><input type="radio" name="source-type" value="csv" checked> CSV</label>
          <label><input type="radio" name="source-type" value="json"> JSON</label>
        </div>
        <div class="source-input">
          <textarea id="custom-data" spellcheck="false" placeholder="CSVまたはJSONを貼り付けてください"></textarea>
          <div class="actions">
            <button id="render-custom" class="quiet" type="button">貼り付けたデータを表示</button>
            <button id="clear-custom" class="quiet" type="button">クリア</button>
          </div>
        </div>
      </div>
      <p class="notes">
        CSV列: 行番号, 列番号, 個体名, 性別, 生年月日, 没日, 父親, 母親, 現在地, アイコン。<br>
        旧形式の「生年月日-没日」も読込時だけ互換対応します。
      </p>
    </details>
  </main>
</body>
</html>
